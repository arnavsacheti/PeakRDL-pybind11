<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" role="img" aria-labelledby="title description">
<title id="title">Generation and build cost across PeakRDL-pybind11 releases</title>
<desc id="description">Four line charts compare generation time, wheel build time, generation peak memory, and build peak memory from v0.2.0 through v0.8.5.</desc>
<style>
            :root { color-scheme: light dark; }
