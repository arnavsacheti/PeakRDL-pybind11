<line class="axis" x1="162.0" y1="302.0" x2="536.0" y2="302.0"/>
<text class="bar-label" x="152.0" y="82.3" text-anchor="end">word32</text>
<rect class="bar profile-0" x="162.0" y="66.5" width="37.4" height="23.6" rx="2" aria-label="word32: 100,001 fields"/>
<text class="bar-value" x="205.4" y="82.3" text-anchor="start">100,001</text>
<text class="bar-label" x="152.0" y="123.0" text-anchor="end">bytes4</text>
<rect class="bar profile-1" x="162.0" y="107.2" width="149.6" height="23.6" rx="2" aria-label="bytes4: 400,004 fields"/>
