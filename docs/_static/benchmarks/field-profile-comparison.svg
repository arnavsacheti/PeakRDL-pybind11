<text class="tick" x="349.0" y="324.0" text-anchor="middle">500,000</text>
<line class="grid" x1="442.5" y1="58.0" x2="442.5" y2="302.0"/>
<text class="tick" x="442.5" y="324.0" text-anchor="middle">750,000</text>
<line class="grid" x1="536.0" y1="58.0" x2="536.0" y2="302.0"/>
