<rect class="bar profile-4" x="162.0" y="229.2" width="299.2" height="23.6" rx="2" aria-label="flags8 packed: 800,008 fields"/>
<text class="bar-value" x="467.2" y="245.0" text-anchor="start">800,008</text>
<text class="bar-label" x="152.0" y="285.7" text-anchor="end">flags8 spread</text>
<rect class="bar profile-5" x="162.0" y="269.9" width="299.2" height="23.6" rx="2" aria-label="flags8 spread: 800,008 fields"/>
<text class="bar-value" x="467.2" y="285.7" text-anchor="start">800,008</text>
</g>
