<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title description">
<title id="title">Runtime access latency and artifact size across PeakRDL-pybind11 releases</title>
<desc id="description">Two line charts compare register read and write latency and generated source and wheel size from v0.2.0 through v0.8.5.</desc>
<style>
            :root { color-scheme: light dark; }
            .panel-title, .value-label, .legend { fill: #172033; }
            .panel-title { font: 600 14px system-ui, sans-serif; }
            .unit, .tick { fill: #5d6678; font: 11px system-ui, sans-serif; }
            .legend, .value-label { font: 11px system-ui, sans-serif; }
            .grid { stroke: #d9dde6; stroke-width: 1; }
            .axis { stroke: #838b9b; stroke-width: 1; }
            .series { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
            .point { stroke-width: 2; }
            .series-a { stroke: #2563eb; }
            .series-b { stroke: #c2410c; }
            .point.series-a { fill: #2563eb; }
            .point.series-b { fill: #c2410c; }
            @media (prefers-color-scheme: dark) {
                .panel-title, .value-label, .legend { fill: #ecf0f7; }
                .unit, .tick { fill: #aab2c2; }
                .grid { stroke: #3b4352; }
                .axis { stroke: #7d8799; }
                .series-a { stroke: #60a5fa; }
                .series-b { stroke: #fb923c; }
                .point.series-a { fill: #60a5fa; }
                .point.series-b { fill: #fb923c; }
            }
        </style>
<g class="panel" aria-label="Register access latency">
<text class="panel-title" x="20.0" y="28.0">Register access latency</text>
<text class="unit" x="450.0" y="28.0" text-anchor="end">microseconds per call</text>
<line class="grid" x1="74.0" y1="246.0" x2="436.0" y2="246.0"/>
<text class="tick" x="66.0" y="250.0" text-anchor="end">0</text>
<line class="grid" x1="74.0" y1="195.0" x2="436.0" y2="195.0"/>
<text class="tick" x="66.0" y="199.0" text-anchor="end">2.5</text>
<line class="grid" x1="74.0" y1="144.0" x2="436.0" y2="144.0"/>
<text class="tick" x="66.0" y="148.0" text-anchor="end">5</text>
<line class="grid" x1="74.0" y1="93.0" x2="436.0" y2="93.0"/>
<text class="tick" x="66.0" y="97.0" text-anchor="end">7.5</text>
<line class="grid" x1="74.0" y1="42.0" x2="436.0" y2="42.0"/>
<text class="tick" x="66.0" y="46.0" text-anchor="end">10</text>
<line class="axis" x1="74.0" y1="246.0" x2="436.0" y2="246.0"/>
<text class="tick" x="74.0" y="268.0" text-anchor="middle">v0.2.0</text>
<text class="tick" x="146.4" y="268.0" text-anchor="middle">v0.4.0</text>
<text class="tick" x="218.8" y="268.0" text-anchor="middle">v0.5.0</text>
<text class="tick" x="291.2" y="268.0" text-anchor="middle">v0.6.0</text>
<text class="tick" x="363.6" y="268.0" text-anchor="middle">v0.7.0</text>
<text class="tick" x="436.0" y="268.0" text-anchor="middle">v0.8.5</text>
<polyline class="series series-a" points="74.0,239.3 146.4,110.9 218.8,212.8 291.2,211.9 363.6,194.4 436.0,198.6" aria-label="Read"/>
<circle class="point series-a" cx="74.0" cy="239.3" r="3.5"/>
<circle class="point series-a" cx="146.4" cy="110.9" r="3.5"/>
<circle class="point series-a" cx="218.8" cy="212.8" r="3.5"/>
<circle class="point series-a" cx="291.2" cy="211.9" r="3.5"/>
<circle class="point series-a" cx="363.6" cy="194.4" r="3.5"/>
<circle class="point series-a" cx="436.0" cy="198.6" r="3.5"/>
<text class="value-label" x="432.0" y="189.6" text-anchor="end">2.3</text>
<polyline class="series series-b" points="74.0,239.3 146.4,237.9 218.8,234.9 291.2,233.6 363.6,224.0 436.0,214.5" aria-label="Write"/>
<circle class="point series-b" cx="74.0" cy="239.3" r="3.5"/>
<circle class="point series-b" cx="146.4" cy="237.9" r="3.5"/>
<circle class="point series-b" cx="218.8" cy="234.9" r="3.5"/>
<circle class="point series-b" cx="291.2" cy="233.6" r="3.5"/>
<circle class="point series-b" cx="363.6" cy="224.0" r="3.5"/>
<circle class="point series-b" cx="436.0" cy="214.5" r="3.5"/>
<text class="value-label" x="432.0" y="230.5" text-anchor="end">1.5</text>
<line class="series series-a" x1="81.0" y1="52.0" x2="99.0" y2="52.0"/>
<text class="legend" x="106.0" y="56.0">Read</text>
<line class="series series-b" x1="81.0" y1="70.0" x2="99.0" y2="70.0"/>
<text class="legend" x="106.0" y="74.0">Write</text>
</g>
<g class="panel" aria-label="Generated artifact size">
<text class="panel-title" x="470.0" y="28.0">Generated artifact size</text>
<text class="unit" x="900.0" y="28.0" text-anchor="end">KiB</text>
<line class="grid" x1="524.0" y1="246.0" x2="886.0" y2="246.0"/>
<text class="tick" x="516.0" y="250.0" text-anchor="end">0</text>
<line class="grid" x1="524.0" y1="195.0" x2="886.0" y2="195.0"/>
<text class="tick" x="516.0" y="199.0" text-anchor="end">50</text>
<line class="grid" x1="524.0" y1="144.0" x2="886.0" y2="144.0"/>
<text class="tick" x="516.0" y="148.0" text-anchor="end">100</text>
<line class="grid" x1="524.0" y1="93.0" x2="886.0" y2="93.0"/>
<text class="tick" x="516.0" y="97.0" text-anchor="end">150</text>
<line class="grid" x1="524.0" y1="42.0" x2="886.0" y2="42.0"/>
<text class="tick" x="516.0" y="46.0" text-anchor="end">200</text>
<line class="axis" x1="524.0" y1="246.0" x2="886.0" y2="246.0"/>
<text class="tick" x="524.0" y="268.0" text-anchor="middle">v0.2.0</text>
<text class="tick" x="596.4" y="268.0" text-anchor="middle">v0.4.0</text>
<text class="tick" x="668.8" y="268.0" text-anchor="middle">v0.5.0</text>
<text class="tick" x="741.2" y="268.0" text-anchor="middle">v0.6.0</text>
<text class="tick" x="813.6" y="268.0" text-anchor="middle">v0.7.0</text>
<text class="tick" x="886.0" y="268.0" text-anchor="middle">v0.8.5</text>
<polyline class="series series-a" points="524.0,220.9 596.4,215.3 668.8,213.4 741.2,196.4 813.6,155.2 886.0,121.0" aria-label="Sources"/>
<circle class="point series-a" cx="524.0" cy="220.9" r="3.5"/>
<circle class="point series-a" cx="596.4" cy="215.3" r="3.5"/>
<circle class="point series-a" cx="668.8" cy="213.4" r="3.5"/>
<circle class="point series-a" cx="741.2" cy="196.4" r="3.5"/>
<circle class="point series-a" cx="813.6" cy="155.2" r="3.5"/>
<circle class="point series-a" cx="886.0" cy="121.0" r="3.5"/>
<text class="value-label" x="882.0" y="137.0" text-anchor="end">123</text>
<polyline class="series series-b" points="524.0,144.0 596.4,139.8 668.8,139.8 741.2,125.7 813.6,106.1 886.0,104.0" aria-label="Wheel"/>
<circle class="point series-b" cx="524.0" cy="144.0" r="3.5"/>
<circle class="point series-b" cx="596.4" cy="139.8" r="3.5"/>
<circle class="point series-b" cx="668.8" cy="139.8" r="3.5"/>
<circle class="point series-b" cx="741.2" cy="125.7" r="3.5"/>
<circle class="point series-b" cx="813.6" cy="106.1" r="3.5"/>
<circle class="point series-b" cx="886.0" cy="104.0" r="3.5"/>
<text class="value-label" x="882.0" y="95.0" text-anchor="end">139</text>
<line class="series series-a" x1="531.0" y1="52.0" x2="549.0" y2="52.0"/>
<text class="legend" x="556.0" y="56.0">Sources</text>
<line class="series series-b" x1="531.0" y1="70.0" x2="549.0" y2="70.0"/>
<text class="legend" x="556.0" y="74.0">Wheel</text>
</g>
</svg>
